name: platform-release-gate
on:
  pull_request:
    paths: ['apps/**', 'packages/**', 'plugins/**', 'desktop/**', 'tools/**', 'src/**', 'web/**', 'workshop/**', 'package*.json', 'docs/feature-parity.json', 'docs/parity/**', 'docs/science/**', '.github/workflows/platform.yml']
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'plugins/**', 'desktop/**', 'tools/**', 'src/**', 'web/**', 'workshop/**', 'package*.json', 'docs/feature-parity.json', 'docs/parity/**', 'docs/science/**', '.github/workflows/platform.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node tools/check-feature-parity.mjs
      - run: node tools/build.mjs --check
      - run: node desktop/scripts/sync.js --viewer-only
      - run: node tools/check-copies.mjs
      - run: node workshop/tools/validate.mjs
  windows-artifact:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Live RCSB retrieval, pinned hashes
        run: node tools/fetch-smoke-structures.mjs --dir desktop/dist/smoke-structures --refresh
      - name: Real-coordinate classic/candidate numeric invariants
        run: node tools/parity-numerics.mjs --fixtures desktop/dist/smoke-structures --output desktop/dist/gate-parity-numerics.json
      - name: Build and check stage dependency closure
        shell: pwsh
        run: |
          $stageOutput = & node desktop/scripts/package-platform.cjs --stage-only
          if ($LASTEXITCODE -ne 0) { throw 'Stage build failed' }
          $stagePath = $stageOutput[-1]
          "GLOW_STAGE=$stagePath" >> $env:GITHUB_ENV
      - name: Stage-root three-entry and mechanism round trips
        run: node tools/platform-release-smoke.cjs --stage "$env:GLOW_STAGE" --fixtures desktop/dist/smoke-structures --output desktop/dist/gate-stage
      - name: Stage security UI and live Electron cache regression
        run: node tools/security-smoke.cjs --stage "$env:GLOW_STAGE" --live --output desktop/dist/gate-security-stage
      - name: Studio M3 authoring regression
        shell: pwsh
        run: |
          $env:GLOW_M3_SCREENSHOTS = Join-Path $pwd 'desktop/dist/gate-m3'
          New-Item -ItemType Directory -Force -Path $env:GLOW_M3_SCREENSHOTS | Out-Null
          $scriptPath = (Resolve-Path tools/studio-smoke.cjs).Path
          $process = Start-Process -FilePath desktop/node_modules/electron/dist/electron.exe -ArgumentList @('--enable-unsafe-swiftshader','--use-angle=swiftshader',('"'+$scriptPath+'"')) -Wait -WindowStyle Hidden -PassThru -RedirectStandardOutput desktop/dist/gate-m3/stdout.log -RedirectStandardError desktop/dist/gate-m3/stderr.log
          Get-Content desktop/dist/gate-m3/stdout.log,desktop/dist/gate-m3/stderr.log
          if ($process.ExitCode -ne 0) { throw 'Studio M3 failed' }
      - name: Build Windows portable candidate (never publish)
        run: node desktop/scripts/package-platform.cjs
      - name: Actual portable EXE three-entry and mechanism round trips
        shell: pwsh
        run: |
          $candidate = Get-Content -LiteralPath desktop/dist/release/candidate.json | ConvertFrom-Json
          $candidatePath = Join-Path $pwd ('desktop/dist/release/' + $candidate.file)
          if (-not (Test-Path -LiteralPath $candidatePath)) { throw 'No portable EXE' }
          & node tools/platform-release-smoke.cjs --exe $candidatePath --fixtures desktop/dist/smoke-structures --output desktop/dist/gate-exe
          exit $LASTEXITCODE
      - name: Actual portable EXE security regression
        shell: pwsh
        run: |
          $candidate = Get-Content -LiteralPath desktop/dist/release/candidate.json | ConvertFrom-Json
          $candidatePath = Join-Path $pwd ('desktop/dist/release/' + $candidate.file)
          & node tools/security-smoke.cjs --exe $candidatePath --live --output desktop/dist/gate-security-exe
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-candidate-and-evidence
          if-no-files-found: warn
          path: |
            desktop/dist/release/**
            desktop/dist/gate-stage/**
            desktop/dist/gate-exe/**
            desktop/dist/gate-m3/**
            desktop/dist/gate-parity-numerics.json
            desktop/dist/gate-security-stage/**
            desktop/dist/gate-security-exe/**
            !desktop/dist/**/profile/**
            !desktop/dist/**/extracted-check-*/**
