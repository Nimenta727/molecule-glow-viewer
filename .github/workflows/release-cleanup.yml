name: release-cleanup
# One-off: remove the phage works that were attached to a release by mistake and rewrite its notes from the repository's release note file.
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: 'desktop-v0.10.0'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in t7-capsid-gp10a.glow t7-capsid-gp10a.png t7-core-proteins.glow t7-core-proteins.png t7-portal-tail.glow t7-portal-tail.png t7-virion-cutaway.glow t7-virion-cutaway.png SHA256SUMS-phage.txt; do
            gh release delete-asset "${{ inputs.tag }}" "$name" --yes --repo "$GITHUB_REPOSITORY" || echo "not present: $name"
          done
          gh release edit "${{ inputs.tag }}" --title "$(head -1 docs/releases/${{ inputs.tag }}.md 2>/dev/null | sed 's/^# //' || true)" --notes-file "docs/releases/${{ inputs.tag }}.md" --repo "$GITHUB_REPOSITORY"
          gh release view "${{ inputs.tag }}" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY"
