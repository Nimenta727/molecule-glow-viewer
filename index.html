<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分子光影查看器</title>
<style>
  :root{--bg:#000;--panel:rgba(12,14,22,.80);--line:rgba(255,255,255,.09);--text:#e8ecf4;--dim:#8d96a8;--acc:#e07ad8;--acc2:#7fb6f5}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  #panel{position:fixed;top:12px;left:12px;width:310px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:12px 14px;scrollbar-width:thin;transition:transform .25s}
  #panel.hidden{transform:translateX(-340px)}
  h1{font-size:15px;margin:0 0 8px;letter-spacing:.5px}
  h2{font-size:11px;letter-spacing:1.2px;color:var(--dim);margin:14px 0 6px;border-top:1px solid var(--line);padding-top:10px;font-weight:600}
  .row{display:flex;align-items:center;gap:8px;margin:5px 0}
  .row label{flex:0 0 92px;color:var(--dim)}
  .row input[type=range]{flex:1;accent-color:var(--acc)}
  .row output{flex:0 0 38px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
  input[type=text],select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font:inherit}
  input[type=text]{flex:1;text-transform:uppercase}
  button{background:linear-gradient(135deg,#c95fc4,#6f8ff0);border:0;color:#fff;border-radius:7px;padding:6px 12px;font:inherit;cursor:pointer}
  button.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:wait}
  .presets{display:flex;flex-wrap:wrap;gap:5px}
  .presets button{background:rgba(255,255,255,.07);border:1px solid var(--line);padding:4px 8px;font-size:12px}
  .presets button:hover{border-color:var(--acc)}
  .chk{display:flex;align-items:center;gap:6px;margin:4px 0;color:var(--dim);cursor:pointer}
  .chk input{accent-color:var(--acc)}
  #legend .ent,#legend .hdr{display:grid;grid-template-columns:14px 1fr 18px 18px 18px;gap:5px;align-items:center;margin:3px 0;font-size:12px}
  #legend .hdr{font-size:10.5px;color:var(--dim)}
  #legend .sw{width:13px;height:13px;border-radius:50%;box-shadow:0 0 8px currentColor}
  #legend .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #legend input{accent-color:var(--acc2);margin:0}
  #status{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 16px;color:var(--dim);transition:opacity .4s;pointer-events:none;white-space:nowrap}
  #caption{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);max-width:min(860px,90vw);text-align:center;color:#dfe6f5;font-size:14px;line-height:1.6;text-shadow:0 0 12px #000,0 0 4px #000;pointer-events:none}
  #caption .cnt{display:block;color:#ffe680;font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
  #title{position:fixed;top:16px;right:18px;text-align:right;pointer-events:none;max-width:45%}
  #title .id{font-size:22px;font-weight:600;letter-spacing:2px;background:linear-gradient(90deg,#f08ae6,#8fc0ff);-webkit-background-clip:text;color:transparent}
  #title .t{color:var(--dim);font-size:12px}
  #toggle{position:fixed;bottom:14px;left:12px}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,30,.7);border:3px dashed var(--acc);font-size:20px;z-index:9}
  #drop.on{display:flex}
  .sub{color:var(--dim);font-size:11.5px}
  #help{color:var(--dim);font-size:11.5px;margin-top:8px}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lab{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;
       padding:3px 9px 4px;border-radius:10px;background:rgba(8,10,20,.62);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px);
       color:#eef2ff;font-size:13px;line-height:1.3;text-shadow:0 0 6px #000}
  .lab b{display:block;font-weight:600}.lab i{display:block;font-style:normal;font-size:11px;color:#b9c3dc}
  .lab::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:16px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}
  .lab.on{border-color:#ffe680}
  #infoCard{position:fixed;right:18px;bottom:110px;width:min(360px,80vw);padding:14px 16px;border-radius:14px;background:rgba(10,12,24,.86);
       border:1px solid rgba(255,255,255,.16);color:#e6ebf7;font-size:13.5px;line-height:1.7;display:none;backdrop-filter:blur(6px)}
  #infoCard h3{margin:0 0 6px;font-size:16px}#infoCard .x{position:absolute;right:10px;top:6px;cursor:pointer;color:#9aa6c4;font-size:18px}
  #infoCard .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="title"><div class="id" id="tId">—</div><div class="t" id="tName"></div></div>
<div id="caption"></div>
<div id="labels"></div>
<div id="infoCard"><span class="x" id="infoX">×</span><h3 id="infoT"></h3><div id="infoB"></div></div>
<div id="drop">松开鼠标导入结构文件（.cif / .pdb）</div>

<div id="panel">
  <h1>分子光影查看器</h1>
  <div class="row"><input type="text" id="pdb" value="6ZPO" maxlength="12" spellcheck="false"><button id="load">加载</button></div>
  <div class="row"><button class="ghost" id="fileBtn">导入本地文件</button><input type="file" id="file" accept=".cif,.mmcif,.pdb,.ent" hidden><span class="sub">或把文件拖进窗口</span></div>
  <div class="sub">输入任意 PDB 编号，直接从 RCSB 下载（含小分子）</div>
  <h2>预设</h2>
  <div class="presets" id="presets"></div>

  <h2>过程动画</h2>
  <label class="chk"><input type="checkbox" id="procOn" checked>显示相互作用过程（质子 / 离子 / ATP 合成）</label>
  <div class="row"><label>转子转速</label><input type="range" id="spin" min="0" max="3" step="0.02" value="0.6"><output></output></div>
  <div class="row"><label>构象变化</label><input type="range" id="morph" min="0" max="1" step="0.01" value="0"><output></output></div>
  <label class="chk"><input type="checkbox" id="morphAuto" checked>自动往返播放构象变化</label>
  <div class="row"><label>热运动</label><input type="range" id="jitter" min="0" max="1" step="0.02" value="0.25"><output></output></div>
  <label class="chk"><input type="checkbox" id="pause">暂停（空格）</label>
  <label class="chk"><input type="checkbox" id="autoRot">相机自动环绕</label>

  <h2>小分子</h2>
  <label class="chk"><input type="checkbox" id="ligOn" checked>显示小分子（配体、核苷酸、离子、脂质）</label>
  <div class="row"><label>小分子大小</label><input type="range" id="ligScale" min="0.8" max="4" step="0.05" value="2.6"><output></output></div>
  <div class="row"><label>结合位点闪光</label><input type="range" id="hot" min="0" max="1.5" step="0.05" value="0.6"><output></output></div>

  <h2>外观</h2>
  <div class="row"><label>显示模式</label><select id="repMode"><option value="blob">团块（写实）</option><option value="cartoon">结构示意（螺旋 / 折叠）</option><option value="shape">简化示意（几何形状 + 讲解）</option></select></div>
  <div class="row"><label>简化程度</label><select id="shapeDetail"><option value="chain">每条链一个形状</option><option value="domain">按结构域</option></select></div>
  <label class="chk"><input type="checkbox" id="labelsOn">显示标注与讲解（点标签看详细说明）</label>
  <label class="chk"><input type="checkbox" id="shellOn" checked>结构示意模式显示外形轮廓</label>
  <div class="row"><label>配色</label><select id="colorMode"><option value="entity">按蛋白种类</option><option value="chain">按链</option><option value="rainbow">彩虹（N→C）</option></select></div>
  <div class="row"><label>色板</label><select id="palette"><option value="neon">霓虹（参考图）</option><option value="pastel">粉彩</option><option value="goodsell">古德塞尔</option></select></div>
  <div class="row"><label>团块大小</label><input type="range" id="blob" min="1.5" max="8" step="0.1" value="4.6"><output></output></div>
  <div class="row"><label>团块起伏</label><input type="range" id="lumpy" min="0" max="1" step="0.05" value="0.5"><output></output></div>
  <div class="row"><label>辉光</label><input type="range" id="bloom" min="0" max="2" step="0.05" value="0.35"><output></output></div>
  <div class="row"><label>边缘光</label><input type="range" id="rim" min="0" max="1.5" step="0.05" value="0.55"><output></output></div>
  <div class="row"><label>自发光</label><input type="range" id="glow" min="0" max="0.5" step="0.01" value="0.05"><output></output></div>
  <div class="row"><label>曝光</label><input type="range" id="exposure" min="0.3" max="2" step="0.05" value="0.88"><output></output></div>
  <div class="row"><label>饱和度</label><input type="range" id="sat" min="0.5" max="2" step="0.02" value="1.3"><output></output></div>
  <div class="row"><label>对比度</label><input type="range" id="con" min="0.7" max="1.6" step="0.02" value="1.12"><output></output></div>
  <div class="row"><label>画质</label><select id="quality"><option value="high">高（独显）</option><option value="medium">中</option><option value="low">低（核显/无显卡）</option></select></div>
  <div class="sub" id="fpsOut">帧率：—</div>
  <label class="chk"><input type="checkbox" id="ao" checked>环境光遮蔽（立体感）</label>
  <label class="chk"><input type="checkbox" id="dof" checked>景深（对焦旋转中心）</label>
  <div class="row"><label>景深强度</label><input type="range" id="dofAmt" min="0" max="1" step="0.02" value="0.35"><output></output></div>

  <h2>膜</h2>
  <label class="chk"><input type="checkbox" id="memOn">显示脂双层膜</label>
  <div class="row"><label>膜 1 位置</label><input type="range" id="mem1" min="-1" max="1" step="0.005" value="0"><output></output></div>
  <label class="chk"><input type="checkbox" id="mem2On">第二层膜</label>
  <div class="row"><label>膜 2 位置</label><input type="range" id="mem2" min="-1" max="1" step="0.005" value="0.3"><output></output></div>
  <div class="row"><label>膜半径</label><input type="range" id="memR" min="0.8" max="3" step="0.05" value="1.6"><output></output></div>

  <h2>剖切</h2>
  <div class="row"><label>剖切位置</label><input type="range" id="cut" min="-1.05" max="1.05" step="0.01" value="1.05"><output></output></div>
  <div class="row"><label>剖切对象</label><select id="cutWhat"><option value="mem">只切膜</option><option value="all">全部</option></select></div>

  <h2>组成（显示 / 旋转 / 剖开）</h2>
  <div id="legend"></div>

  <h2>其他</h2>
  <div class="row"><label>主轴</label><select id="axisMode"><option value="long">最长轴竖直</option><option value="sym">对称轴竖直（环/通道）</option><option value="short">最短轴竖直</option><option value="native">原始坐标</option></select></div>
  <label class="chk"><input type="checkbox" id="assembly" checked>生物学组装体（assembly 1）</label>
  <div class="row"><button class="ghost" id="shot">截图 PNG</button><button class="ghost" id="resetCam">重置视角</button></div>
  <div class="row"><button class="ghost" id="aimCut">剖面对准当前视角</button></div>
  <div id="help">左键旋转 · 右键平移 · 滚轮缩放 · H 隐藏面板 · 空格暂停</div>
</div>
<button class="ghost" id="toggle">☰ 面板</button>
<div id="status">准备中…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Pass } from 'three/addons/postprocessing/Pass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =============================================================================
   1. PRESETS  (every structure is downloaded live from RCSB)
   Fields are documented in references/parameters.md. Keyword matching is a
   case-insensitive "name contains"; when several keys match, the FIRST key wins,
   so list longer / more specific keys first. A key may also be a regex string "/.../".
   ============================================================================= */
const PRESETS = {
  'ATP 合酶（合成 ATP）': {
    id: '6ZPO', axisFrom: ['subunit C1', 'subunit beta'], blob: 4.4,
    spin: ['subunit gamma', 'subunit delta', 'subunit epsilon', 'subunit C1'],
    ghost: ['subunit alpha', 'subunit beta'],
    membranes: [{ at: 'subunit C1', offset: 0 }], memR: 1.2, cut: 0.0, cutWhat: 'mem',
    process: 'atpSynthase',
    colors: { 'subunit alpha': '#e64fc8', 'subunit beta': '#5b9dff', 'subunit gamma': '#e3e7f2', 'subunit delta': '#e3e7f2', 'subunit epsilon': '#e3e7f2',
              'subunit C1': '#3fc864', '/subunit a$/': '#2448e8', 'subunit O': '#ff9a50', 'B1': '#ff9a50', '/subunit d,/': '#ff9a50', 'factor 6': '#ff9a50', 'inhibitor': '#f5e07a' },
    camera: { az: -0.55, el: 0.12, dist: 1.05 },
    /* teaching notes: key (same matching rules as colors) -> [label, one-line role, longer explanation] */
    notes: {
      'subunit alpha': ['α 亚基 ×3', 'F1 头部，非催化', '与 β 交替排成 α3β3 六聚体（F1 头部）。α 也结合核苷酸，但它的位点不催化，主要起结构和调节作用。催化位点位于 α/β 交界、以 β 为主。'],
      'subunit beta': ['β 亚基 ×3', '催化位点：合成 ATP', '三个 β 同一时刻处在三种不同构象：开放（空）、松弛（结合 ADP + Pi）、紧密（ADP + Pi 合成 ATP）。γ 每转 120°，三个 β 依次换一种构象——这就是 Boyer 的“结合变构机制”。本动画中 β 的形状来自 6ZPO 三条 β 链的真实构象。'],
      'subunit gamma': ['γ 亚基', '中心柄（转子）', '细长的 γ 插在 α3β3 中央，形状不对称。它转动时依次顶住不同的 β，迫使 β 改变构象，把转动的机械能变成化学能。'],
      'subunit delta': ['δ 亚基', '中心柄', '与 γ、ε 一起组成中心柄，把 c 环的转动传到 F1 头部。'],
      'subunit epsilon': ['ε 亚基', '中心柄', '中心柄的一部分，连接 γ 与 c 环。'],
      'subunit C1': ['c 环（c8）', '膜内转子，运 H⁺', '8 个 c 亚基围成的环嵌在线粒体内膜里。每个 c 亚基中部有一个谷氨酸（Glu58）可接受一个 H⁺。H⁺ 顺浓度梯度流过时推动 c 环转动：转一圈运 8 个 H⁺、产生 3 个 ATP（约 2.7 H⁺/ATP）。'],
      '/subunit a$/': ['a 亚基', '定子：H⁺ 半通道', 'a 亚基紧贴 c 环，提供两个错开的半通道：H⁺ 从膜间隙一侧进入、结合到 c 亚基上，随 c 环转近一圈后从另一个半通道释放到基质。a 亚基上保守的精氨酸防止 H⁺ 直接“短路”。'],
      'subunit O': ['OSCP', '外周柄顶端', 'OSCP 像帽子扣在 α3β3 顶部，把头部固定在外周柄上，使它不跟着 γ 一起转——否则无法产生相对转动。'],
      'B1': ['b 亚基', '外周柄（定子臂）', '长螺旋从膜内一直伸到 F1 头部，与 d、F6 组成外周柄，像定子臂一样把 α3β3 固定住。'],
      '/subunit d,/': ['d 亚基', '外周柄', '外周柄组成部分。'],
      'factor 6': ['F6', '外周柄', '外周柄组成部分。'],
      'inhibitor': ['IF1', '抑制蛋白', 'IF1 抑制 ATP 合酶反向水解 ATP（例如缺氧时防止浪费 ATP）。'],
    },
  },
  '鞭毛马达': {
    id: '7CGO', axis: 'long', up: 'hook protein', blob: 5.0, horizontal: true,
    spin: ['rod', 'hook', 'M-ring', 'MS ring', 'FliE', 'FliP', 'FliQ', 'FliR', 'C 环', 'flagellin', '鞭毛丝', 'Dc loop'],
    membranes: [{ at: 'M-ring', offset: 18 }, { at: 'L-ring', offset: 0 }],
    memR: 1.3, cut: 0.0, cutWhat: 'mem', process: 'flagellarMotor',
    components: [
      { id: '8YJT', label: 'C 环（FliG/FliM/FliN）', axis: 'short', anchor: 'M-ring', side: 'below', gap: -40 },
      { id: '6YKM', label: '定子 MotA/MotB', axis: 'long', anchor: 'M-ring', side: 'at', dy: 10, arrange: { kind: 'ring', n: 11, radius: 215 }, spin: false },
      { id: '1UCU', label: '鞭毛丝（鞭毛蛋白）', axis: 'native', anchor: 'hook protein', side: 'above', gap: 0, arrange: { kind: 'helix', n: 130, rise: 4.7, twist: 65.8 } },
    ],
    colors: { 'C 环': '#d93fbf', '定子': '#3fc864', '鞭毛丝': '#e9ecf5', 'hook protein': '#e64fc8', 'M-ring': '#6aa8ff', 'MS ring': '#6aa8ff',
              'L-ring': '#2448e8', 'P-ring': '#3a64ff', 'rod': '#b8c8ff', 'FliE': '#b8c8ff', 'Dc loop': '#b8c8ff', 'FliP': '#ff9a50', 'FliQ': '#ff9a50', 'FliR': '#ff9a50' },
    camera: { az: -0.75, el: 0.22, dist: 1.3 },
    notes: {
      '定子': ['定子 MotA/MotB ×11', '利用 H⁺ 流产生力矩', '每个定子是 MotA5B2 复合物，MotB 锚定在细胞壁（肽聚糖）上。H⁺ 经 MotA/MotB 通道流入细胞，使 MotA 五聚体转动，像齿轮一样拨动 C 环。'],
      'C 环': ['C 环（FliG/FliM/FliN）', '转子 + 换向开关', '位于胞质侧的大环。FliG 与定子接触接受力矩；CheY-P 结合 FliM 后 C 环构象改变，使电机由逆时针（前进）切换为顺时针（翻滚）。'],
      'M-ring': ['MS 环', '膜内转子基座', 'FliF 组成的环嵌在内膜中，与 C 环相连，一起转动。'],
      'MS ring': ['MS 环', '膜内转子基座', 'FliF 组成的环嵌在内膜中，与 C 环相连，一起转动。'],
      'L-ring': ['L 环', '外膜轴承', '嵌在外膜（LPS 层）中，像轴承一样让杆在其中转动。'],
      'P-ring': ['P 环', '肽聚糖层轴承', '位于细胞壁肽聚糖层，与 L 环一起组成轴承。'],
      'rod': ['杆', '传动轴', '把转子的转动穿过细胞壁传到外面的钩。'],
      'hook protein': ['钩', '柔性万向节', '弯曲的短管，把转动传给鞭毛丝，同时允许方向改变。'],
      '鞭毛丝': ['鞭毛丝', '螺旋桨', '由上万个鞭毛蛋白组装成的长螺旋管，转动时推动细菌前进。'],
      'FliP': ['输出装置', '组装鞭毛的输出通道', 'FliP/FliQ/FliR 组成输出门，把鞭毛蛋白从中央通道送到顶端组装。'],
    } },

  ]);

    if (fa.length && fb.length) {   // spin axis passes through the centroid of part A and points to part B (e.g. c-ring -> F1 head)
      const cA = centroid(fa), dir = centroid(fb).sub(cA).normalize();
      applyTf(main, { centre: cA, q: new THREE.Quaternion().setFromUnitVectors(dir, new THREE.Vector3(0, 1, 0)) });
      const ys = main.atoms.map(a => a.p.y);
      applyTf(main, { centre: new THREE.Vector3(0, (Math.min(...ys) + Math.max(...ys)) / 2, 0), q: new THREE.Quaternion() });
    } else applyTf(main, orientTransform(main.atoms.map(a => a.p), mode));
    if (cfg.up && !cfg.axisFrom) {
      const ups = main.atoms.filter(a => kwMatch(main.entities[a.ent]?.name || '', cfg.up));
      if (ups.length && ups.reduce((s, a) => s + a.p.y, 0) / ups.length < 0)
        applyTf(main, { centre: new THREE.Vector3(), q: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI) });
    }
    const pts = main.atoms.map(a => a.p), fc = new THREE.Vector3(); pts.forEach(p => fc.add(p)); fc.multiplyScalar(1 / pts.length);
    const focus = { centre: fc, radius: Math.max(...pts.map(p => p.distanceTo(fc))) };
    // ---- parts by entity
    const byEnt = new Map();
    for (const a of main.atoms) { const nm = main.entities[a.ent]?.name || ('entity ' + a.ent); a.part = nm; if (!byEnt.has(nm)) byEnt.set(nm, []); byEnt.get(nm).push(a); }
    model = { entityStats: {}, focus };
    for (const [nm, arr] of byEnt) { const ys = arr.map(a => a.p.y); model.entityStats[nm] = { min: Math.min(...ys), max: Math.max(...ys), mean: ys.reduce((s, v) => s + v, 0) / ys.length }; }
    const parts = [...byEnt.entries()].map(([nm, arr]) => ({ name: nm, atoms: arr }));
    let ligands = main.ligands.slice();
    // ---- components (other PDB entries placed relative to the main one)
    for (const comp of cfg.components || []) {
      try {
        status(`下载组件 ${comp.id} …`, true);
        const c = await loadEntry(comp.id, true); live();
        if (comp.axis === 'native') nativeZtoY(c); else applyTf(c, orientTransform(c.atoms.map(a => a.p), comp.axis || 'long'));
        if (comp.flip) applyTf(c, { centre: new THREE.Vector3(), q: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI) });
        const placed = placeComponent(comp, c.atoms, c.ligands);
        placed.atoms.forEach(a => a.part = comp.label || comp.id);
        parts.push({ name: comp.label || comp.id, atoms: placed.atoms, comp });
        ligands.push(...placed.ligands);
      } catch (e) { if (e instanceof Stale) throw e; console.warn(e); status(`组件 ${comp.id} 加载失败：${e.message}`); }
    }
    let rmax = 0, mainR = 0;
    for (const p of parts) for (const a of p.atoms) { rmax = Math.max(rmax, a.p.length()); mainR = Math.max(mainR, Math.hypot(a.p.x, a.p.z)); }
    Object.assign(model, { radius: rmax, mainR, allAtoms: parts.flatMap(p => p.atoms) });
    world.rotation.set(0, 0, cfg.horizontal ? -Math.PI / 2 : 0); world.updateMatrixWorld(true);
    // ---- colours & groups
    parts.sort((a, b) => b.atoms.length - a.atoms.length);
    const nChains = new Set(parts.flatMap(p => p.atoms.map(a => a.asym))).size;
    $('colorMode').value = cfg.colorMode || (parts.length <= 2 && nChains > 6 ? 'chain' : 'entity');
    if (cfg.blob) { $('blob').value = cfg.blob; syncOut($('blob')); }
    const pal = PALETTES[$('palette').value];
    parts.forEach((part, i) => {
      const fk = findKey(cfg.colors, part.name);
      const spin = part.comp?.spin === false ? false : (cfg.spin || []).some(k => kwMatch(part.name, k));
      const ghost = (cfg.ghost || []).some(k => kwMatch(part.name, k));
      groups.push({ name: part.name, color: pal[i % pal.length], fixed: fk ? cfg.colors[fk] : null, atoms: part.atoms, spin, ghost, visible: true, mesh: null });
    });
    // ---- small molecules
    for (const L of ligands) { L.centre = L.atoms.reduce((s, x) => s.add(x.p), new THREE.Vector3()).multiplyScalar(1 / L.atoms.length); L.hidden = false; }
    model.ligands = ligands;
    // ---- membranes
    if (cfg.membranes) {
      $('memOn').checked = true;
      const pos = cfg.membranes.map(mb => { const k = Object.keys(model.entityStats).find(n => kwMatch(n, mb.at || '')); return ((k ? model.entityStats[k].mean : 0) + (mb.offset || 0)) / model.radius; });
      $('mem1').value = pos[0] ?? 0; $('mem2On').checked = pos.length > 1; $('mem2').value = pos[1] ?? 0.3;
    } else { $('memOn').checked = false; $('mem2On').checked = false; }
    $('memR').value = cfg.memR || 1.6;
    $('cut').value = cfg.cut ?? 1.05; if (cfg.cutWhat) $('cutWhat').value = cfg.cutWhat;
    document.querySelectorAll('input[type=range]').forEach(syncOut);
    // ---- process (interaction animation)
    proc = null; $('caption').innerHTML = '';
    const P = cfg.process && PROCESSES[cfg.process];
    if (P) {
      const pr = Object.create(P); pr.ctx = makeCtx();   // activate only after async setup finished
      try { await pr.setup(pr.ctx); live(); proc = pr; } catch (e) { if (e instanceof Stale) throw e; console.warn(e); status('过程动画初始化失败：' + e.message); }
    }
    $('morph').value = 0; U.uMorph.value = 0;
    markHotFromLigands();
    rebuildMeshes(); rebuildLigands(); rebuildMembranes(); applyCut();
    const cap = cfg.caption || (P && P.caption) || '';
    $('caption').innerHTML = cap ? `${cap}<span class="cnt" id="cnt"></span>` : '';
    $('tId').textContent = (cfg.states ? cfg.states.join(' ⇄ ') : main.id) + ((cfg.components || []).length ? ' + ' + cfg.components.map(c => c.id).join(' + ') : '');
    $('tName').textContent = cfg.name || main.title;
    renderLegend(); rebuildLabels();
    resetCamera(cfg.camera); aimCut();
    const total = groups.reduce((s, g) => s + g.atoms.length, 0);
    status(`完成：${total.toLocaleString()} 个残基团块，${ligands.length} 个小分子`);
  } catch (e) { if (e instanceof Stale) return; console.error(e); status('出错：' + e.message, true); }
  $('load').disabled = false;
}

function makeCtx() {
  const ctx = {
    get theta() { return theta; }, get speed() { return +$('spin').value; },
    get ligands() { return model.ligands; }, get allAtoms() { return model.allAtoms; },
    membraneY: [], counters: {},
    atomsOf: (re) => model.allAtoms.filter(a => re.test(a.part)),
    template: getTemplate, makeMol, makeParticle, makeFlash, anim,
    hideLigand: (L) => { L.hidden = true; },
    partGroups: (re) => groups.filter(g => re.test(g.name)),
    /* alternative conformations: process sets a.alts = {key: Vector3} on the residues, then calls this (before meshes are built) */
    setConformations: (g, keys) => { g.confKeys = keys; g.blend = {}; },
    setChainBlend: (g, asym, from, to, w) => { g.blend[asym] = [from, to, w]; },
    get ligScale() { return +$('ligScale').value; },
    markHot: (points, radius = 10) => { for (const a of model.allAtoms) if (points.some(p => a.p.distanceTo(p) < radius + 4)) a.hot = 1; },
  };
  if ($('memOn').checked) { ctx.membraneY.push(+$('mem1').value * model.radius); if ($('mem2On').checked) ctx.membraneY.push(+$('mem2').value * model.radius); }
  return ctx;
}

/* residues within ~8 A of a visible ligand pulse ("结合位点闪光") */
function markHotFromLigands() {
  const cell = 8, grid = new Map();
  for (const L of model.ligands) if (!L.hidden && L.atoms.length < 400) for (const x of L.atoms) {
    const k = `${Math.floor(x.p.x / cell)},${Math.floor(x.p.y / cell)},${Math.floor(x.p.z / cell)}`;
    if (!grid.has(k)) grid.set(k, []); grid.get(k).push(x.p);
  }
  for (const a of model.allAtoms) {
    if (a.hot) continue;
    const gx = Math.floor(a.p.x / cell), gy = Math.floor(a.p.y / cell), gz = Math.floor(a.p.z / cell);
    outer: for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
      const arr = grid.get(`${gx + dx},${gy + dy},${gz + dz}`); if (!arr) continue;
      for (const p of arr) if (a.p.distanceTo(p) < 8) { a.hot = 1; break outer; }
    }
  }
}

function clearScene() {
  proc = null;
  for (const g of groups) if (g.mesh) { world.remove(g.mesh); disposeObj(g.mesh); }
  groups = [];
  for (const lg of ligGroups) world.remove(lg.obj);
  ligGroups = [];
  for (const o of membraneObjs) { world.remove(o); o.geometry.dispose(); o.material.dispose(); }
  membraneObjs = [];
  anims = [];
  while (procRoot.children.length) procRoot.remove(procRoot.children[0]);
  theta = 0;
}

function colourFn(g, gi) {
  const mode = $('colorMode').value, pal = PALETTES[$('palette').value];
  if (mode === 'entity') return null;
  if (mode === 'chain') {
    const ids = [...new Set(g.atoms.map(a => a.asym))];
    const map = new Map(ids.map((id, i) => [id, new THREE.Color(pal[(i + gi) % pal.length])]));
    return (a) => map.get(a.asym);
  }
  const range = new Map();
  for (const a of g.atoms) { const r = range.get(a.asym) || [1e9, -1e9]; r[0] = Math.min(r[0], a.seq); r[1] = Math.max(r[1], a.seq); range.set(a.asym, r); }
  return (a) => { const r = range.get(a.asym); const t = (a.seq - r[0]) / Math.max(1, r[1] - r[0]); return new THREE.Color().setHSL(0.83 - 0.75 * t, 0.8, 0.58); };
}
function disposeObj(o) { o.traverse(x => { if (x.geometry) x.geometry.dispose(); if (x.material) x.material.dispose(); }); }
function rebuildMeshes() {
  const pal = PALETTES[$('palette').value], rep = $('repMode').value;
  groups.forEach((g, i) => {
    if (g.mesh) { world.remove(g.mesh); disposeObj(g.mesh); }
    g.color = ($('palette').value === 'neon' && g.fixed) ? g.fixed : pal[i % pal.length];
    g.mesh = rep === 'cartoon' ? buildCartoon(g, colourFn(g, i)) : rep === 'shape' ? buildShapes(g, colourFn(g, i)) : buildGroup(g, colourFn(g, i));
    g.mesh.visible = g.visible; g.mesh.rotation.y = g.spin ? theta : 0;
    world.add(g.mesh);
  });
}
function rebuildLigands() {
  for (const lg of ligGroups) world.remove(lg.obj);
  const prevVis = new Map(ligGroups.map(l => [l.key, l.visible]));
  ligGroups = [];
  const by = new Map();
  for (const L of model.ligands) if (!L.hidden) { const key = L.comp + '|' + (L.state || 0); if (!by.has(key)) by.set(key, []); by.get(key).push(L); }
  for (const [key, mols] of by) {
    const obj = buildMolecules(mols, +$('ligScale').value);
    const visible = prevVis.get(key) ?? true;
    obj.visible = visible && $('ligOn').checked;
    world.add(obj);
    ligGroups.push({ key, comp: mols[0].comp, name: mols[0].fullName, n: mols.length, obj, visible, state: mols[0].state || 0 });
  }
}

/* ----------------------------------------------------------------------------- membrane */
function rebuildMembranes() {
  for (const o of membraneObjs) { world.remove(o); o.geometry.dispose(); o.material.dispose(); }
  membraneObjs = [];
  if (!$('memOn').checked || !model) return;
  const ys = [+$('mem1').value * model.radius];
  if ($('mem2On').checked) ys.push(+$('mem2').value * model.radius);
  const R = +$('memR').value * model.mainR, spacing = 9.5, maxLipids = 120000;
  const perLeaf = Math.PI * R * R / (spacing * spacing * 0.866);
  const sp = spacing * Math.max(1, Math.sqrt(perLeaf * 2 * ys.length / maxLipids)), cell = 6;
  for (const y0 of ys) {
    const occ = new Set();
    for (const g of groups) if (g.visible) for (const a of g.atoms) if (Math.abs(a.p.y - y0) < 26) {
      const gx = Math.round(a.p.x / cell), gz = Math.round(a.p.z / cell);
      for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) occ.add((gx + dx) + ',' + (gz + dz));
    }
    const heads = [], tails = [];
    for (const leaf of [1, -1]) {
      let row = 0;
      for (let z = -R; z <= R; z += sp * 0.866, row++) for (let x = -R + (row % 2) * sp / 2; x <= R; x += sp) {
        const jx = x + (Math.random() - 0.5) * sp * 0.35, jz = z + (Math.random() - 0.5) * sp * 0.35, rr = Math.hypot(jx, jz);
        if (rr > R || occ.has(Math.round(jx / cell) + ',' + Math.round(jz / cell))) continue;
        const edge = Math.max(0, (rr - R * 0.82) / (R * 0.18)); if (Math.random() < edge * edge) continue;
        heads.push([jx, y0 + leaf * (19 + (Math.random() - 0.5) * 2), jz]);
        tails.push([jx - 1.4, y0 + leaf * 9.5, jz], [jx + 1.4, y0 + leaf * 9.5, jz]);
      }
    }
    const hMesh = new THREE.InstancedMesh(withAttrs(new THREE.IcosahedronGeometry(1, 1), heads.length), blobMaterial({ roughness: 0.25 }), heads.length);
    const tMesh = new THREE.InstancedMesh(withAttrs(new THREE.CylinderGeometry(0.6, 0.4, 15, 5, 1), tails.length), blobMaterial({ roughness: 0.4 }), tails.length);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3(), e = new THREE.Euler(), c = new THREE.Color();
    heads.forEach((h, i) => { s.setScalar(2.5 + Math.random() * 0.4); m.compose(v.set(...h), q.identity(), s); hMesh.setMatrixAt(i, m); hMesh.setColorAt(i, c.set('#e64fc8').offsetHSL((Math.random() - .5) * .03, 0, (Math.random() - .5) * .08)); });
    tails.forEach((t, i) => { e.set((Math.random() - .5) * .35, 0, (Math.random() - .5) * .35); q.setFromEuler(e); s.set(1, 1, 1); m.compose(v.set(...t), q, s); tMesh.setMatrixAt(i, m); tMesh.setColorAt(i, c.set('#eef1f8').offsetHSL(0, 0, (Math.random() - .5) * .1)); });
    for (const mesh of [hMesh, tMesh]) { mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true; mesh.frustumCulled = false; mesh.material.clippingPlanes = [cutPlane]; world.add(mesh); membraneObjs.push(mesh); }
  }
}
function applyCut() {
  const v = +$('cut').value;
  cutPlane.constant = v >= 1.04 ? 1e9 : v * (model ? model.radius : 1);
  const all = $('cutWhat').value === 'all';
  for (const g of groups) if (g.mesh) g.mesh.traverse(x => {
    if (!x.material) return;
    if (x.userData.cartoon) {   // cartoon: global cut, or the wedge (clipIntersection) for "剖" parts
      x.material.clippingPlanes = all ? [cutPlane] : g.ghost ? wedgePlanes : noPlanes;
      x.material.clipIntersection = !all && g.ghost;
    } else x.material.clippingPlanes = planesFor(g);
  });
  for (const o of membraneObjs) o.material.clippingPlanes = [cutPlane];
}

/* ----------------------------------------------------------------------------- legend */
function renderLegend() {
  const L = $('legend');
  L.innerHTML = '<div class="hdr"><span></span><span>名称（数量）</span><span title="显示">显</span><span title="绕主轴旋转">转</span><span title="剖开：切掉朝向镜头的一半，露出内部">剖</span></div>';
  groups.forEach((g) => {
    const d = document.createElement('div'); d.className = 'ent';
    d.innerHTML = `<span class="sw" style="background:${g.color};color:${g.color}"></span><span class="nm" title="${g.name}">${g.name} <span class="sub">(${g.atoms.length.toLocaleString()})</span></span>
      <input type="checkbox" ${g.visible ? 'checked' : ''} data-k="vis"><input type="checkbox" ${g.spin ? 'checked' : ''} data-k="spin"><input type="checkbox" ${g.ghost ? 'checked' : ''} data-k="ghost">`;
    d.querySelector('[data-k=vis]').onchange = (ev) => { g.visible = ev.target.checked; g.mesh.visible = g.visible; };
    d.querySelector('[data-k=spin]').onchange = (ev) => { g.spin = ev.target.checked; g.mesh.rotation.y = g.spin ? theta : 0; };
    d.querySelector('[data-k=ghost]').onchange = (ev) => { g.ghost = ev.target.checked; if (g.ghost) aimCut(); rebuildMeshes(); applyCut(); };
    L.appendChild(d);
  });
  for (const lg of ligGroups) {
    const st = elStyle(lg.comp.length <= 2 ? lg.comp : 'P');
    const d = document.createElement('div'); d.className = 'ent';
    d.innerHTML = `<span class="sw" style="background:${st[0]};color:${st[0]};border-radius:3px"></span><span class="nm" title="${lg.name}">◆ ${lg.comp}${lg.state ? '（构象 2）' : ''} <span class="sub">${lg.name.toLowerCase()} ×${lg.n}</span></span><input type="checkbox" ${lg.visible ? 'checked' : ''}><span></span><span></span>`;
    d.querySelector('input').onchange = (ev) => { lg.visible = ev.target.checked; lg.obj.visible = lg.visible && $('ligOn').checked; };
    L.appendChild(d);
  }
}

/* ----------------------------------------------------------------------------- camera */
function resetCamera(cam) {
  if (!model) return;
  const c = cam || current?.camera || { az: -0.9, el: 0.25, dist: 1.2 };
  const R = model.focus.radius, d = R / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (c.dist || 1);
  const t = model.focus.centre.clone().applyMatrix4(world.matrixWorld);
  controls.target.copy(t);
  camera.position.set(t.x + Math.sin(c.az) * Math.cos(c.el) * d, t.y + Math.sin(c.el) * d, t.z + Math.cos(c.az) * Math.cos(c.el) * d);
  camera.near = d / 200; camera.far = d * 20; camera.updateProjectionMatrix();
  controls.update();
}

/* ----------------------------------------------------------------------------- frame loop */
const clock = new THREE.Clock();
let fpsT = 0, fpsN = 0, morphT = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (!$('pause').checked) {
    U.uTime.value += dt; grade.uniforms.uT.value = U.uTime.value % 10;
    theta += +$('spin').value * dt;
    for (const g of groups) if (g.spin && g.mesh) g.mesh.rotation.y = theta;
    if (current?.states && $('morphAuto').checked) {   // ease-in-out ping-pong with holds at both ends
      morphT += dt * 0.35; const c = (Math.sin(morphT) + 1) / 2; $('morph').value = ease((c - 0.1) / 0.8); syncOut($('morph'));
    }
    U.uMorph.value = +$('morph').value;
    for (const lg of ligGroups) if (current?.states) lg.obj.visible = lg.visible && $('ligOn').checked && (lg.state ? U.uMorph.value > 0.6 : U.uMorph.value < 0.4);
    if (proc && $('procOn').checked) {
      proc.update(proc.ctx, dt); tickAnims(dt);
      const cnt = $('cnt'); if (cnt) cnt.textContent = Object.entries(proc.ctx.counters).map(([k, v]) => `${k}：${v}`).join('　');
    }
  }
  U.uUpView.value.set(0, 1, 0).transformDirection(camera.matrixWorldInverse);
  procRoot.position.copy(world.position); procRoot.quaternion.copy(world.quaternion);
  for (const g of groups) if (g.mesh) {
    if (g.blend) applyBlends(g);
    if (current?.states) g.mesh.traverse(x => {
      if (x.userData.p2Index >= 0 && x.morphTargetInfluences) x.morphTargetInfluences[x.userData.p2Index] = U.uMorph.value;
      if (x.userData.shapes && x.userData.lastMorph !== U.uMorph.value) { x.userData.lastMorph = U.uMorph.value; const w = U.uMorph.value; updateShapes(g, x, (a) => a.p2 ? a.p.clone().lerp(a.p2, w) : a.p); }
    });
  }
  controls.update();
  const dist = camera.position.distanceTo(controls.target);
  bokeh.uniforms.focus.value = dist;
  bokeh.uniforms.aperture.value = +$('dofAmt').value * 0.00003 * Math.min(1, dist / 600);   // weaker when close
  composer.render(); updateLabels();
  fpsT += dt; fpsN++;
  if (fpsT > 2) { window.__fps = fpsN / fpsT; $('fpsOut').textContent = '帧率：' + window.__fps.toFixed(1) + ' fps'; fpsT = 0; fpsN = 0; }
}
frame();

/* ----------------------------------------------------------------------------- start */
window.__viewer = { loadScene, PRESETS, PROCESSES, groups: () => groups, ligands: () => ligGroups, model: () => model, camera, controls, proc: () => proc, entryFromFile };
const params = new URLSearchParams(location.search);
(() => {
  const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '';
  window.__gpu = gpu;
  const soft = /SwiftShader|Basic Render|llvmpipe|softpipe/i.test(gpu);
  const integrated = /Intel|UHD|Iris|Radeon\(TM\) Graphics|Vega \d+ Graphics/i.test(gpu);
  $('quality').value = soft ? 'low' : integrated ? 'medium' : 'high';
  console.log('GPU:', gpu, '-> quality', $('quality').value);
})();
if (params.get('q')) $('quality').value = params.get('q');
applyQuality(false);
const startId = (params.get('pdb') || '').toUpperCase();
const startPreset = params.get('preset') || (startId ? null : 'ATP 合酶（合成 ATP）');
if (startPreset && PRESETS[startPreset]) { $('pdb').value = PRESETS[startPreset].id; loadScene({ ...PRESETS[startPreset], name: startPreset }); }
else if (startId) { $('pdb').value = startId; $('load').click(); }
</script>
</body>
