<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glow Viewer</title>
    <link rel="stylesheet" href="../../src/styles/startup.css">
    <link rel="stylesheet" href="./viewer.css">
    <script type="importmap">
      {
        "imports": {
          "@cfworker/json-schema": "../../node_modules/@cfworker/json-schema/dist/esm/index.js",
          "@zip.js/zip.js": "../../node_modules/@zip.js/zip.js/index-native.min.js",
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script src="../../src/ui/startup.js" data-glow-startup></script>
    <main>
      <header>
        <h1>Glow Viewer</h1>
        <div class="actions" aria-label="场景文件">
          <button id="example" type="button">示例</button>
          <button id="open" type="button">打开</button>
          <input id="file" type="file" accept=".glow,.json,.cif,.mmcif,.pdb,.ent" hidden>
          <button id="save" type="button" disabled>保存</button>
          <button id="close" type="button" disabled>关闭</button>
        </div>
      </header>
      <div class="workspace">
        <section class="viewport-panel" aria-label="场景视口">
          <div id="viewport" aria-label="三维场景">
            <button id="reset-camera" type="button" disabled>重置视角</button>
          </div>
        </section>
        <aside class="info-panel" aria-label="场景信息与结构工具">
          <details id="presentation" hidden>
            <summary>标注、证据与视角</summary>
            <ul id="viewer-notes" aria-label="标注"></ul>
            <ul id="viewer-evidence" aria-label="证据"></ul>
            <ul id="viewer-bookmarks" aria-label="视角书签"></ul>
          </details>
          <details class="structure-tools">
            <summary>结构插件</summary>
            <label><input id="structure-enabled" type="checkbox"> 启用官方结构插件</label>
            <form id="rcsb-form" class="structure-form">
              <label for="accession">RCSB 编号</label>
              <input id="accession" name="accession" type="text" maxlength="4" required disabled>
              <button id="rcsb-load" type="submit" disabled>打开结构</button>
            </form>
            <form id="selection-form" class="structure-form" hidden>
              <label for="chain-id">链</label>
              <input id="chain-id" name="chain" type="text" maxlength="32">
              <label for="residue-id">残基</label>
              <input id="residue-id" name="residue" type="text" maxlength="32">
              <button type="submit">选取</button>
            </form>
          </details>
        </aside>
      </div>
      <footer aria-label="播放与状态">
        <div class="transport" aria-label="时间线">
          <button id="play" type="button" disabled>播放</button>
          <input id="playhead" aria-label="播放时间" type="range" min="0" max="0" step="any" value="0" disabled>
          <output id="time">0.00 / 0.00 s</output>
        </div>
        <p id="status" role="status">启动中…</p>
        <p id="diagnostic" hidden>
          <span id="warning"></span>
          <a id="legacy-viewer" href="../../web/" target="_blank" rel="noopener" hidden>打开旧版 Viewer</a>
        </p>
      </footer>
    </main>
    <script type="module">
      import('./main.mjs').catch(() => {
        window.__glowStartup?.hide();
        document.querySelector('#status').textContent = '无法加载查看器模块。请检查页面和渲染库是否可访问。';
        document.querySelector('#example').disabled = true;
        document.querySelector('#open').disabled = true;
      });
    </script>
  </body>
</html>
